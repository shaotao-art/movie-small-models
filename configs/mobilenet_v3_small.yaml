seed: 42
output_dir: outputs

data:
  root: ./data/subtitle_cls
  image_size: 224
  num_workers: 8

model:
  name: mobilenet_v3_small
  num_classes: 2          # ImageFolder 顺序: has_subtitle=0, no_subtitle=1
  pretrained: true

train:
  global_batch_size: 128  # 单卡 batch = global // 卡数，再按 max_micro_batch_size 截断
  max_micro_batch_size: null  # 单卡上限，超出则用梯度累加；null 表示不限制
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  log_freq: 20
  amp: true               # 仅 CUDA 生效

swanlab:
  project: subtitle-cls
  experiment_name: mobilenet_v3_small
