# 通用模板：自定义 ImageFolder 数据集（<root>/train|val/<class>），改 root/num_classes 即可
seed: 42
output_dir: outputs

data:
  root: ./data            # expects ./data/train/<class>/*.jpg and ./data/val/<class>/*.jpg
  image_size: 224
  num_workers: 8

model:
  name: resnet18
  num_classes: 10
  pretrained: true

train:
  global_batch_size: 64
  max_micro_batch_size: null
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  log_freq: 50            # batches between log lines

swanlab:
  project: resnet-finetune
  experiment_name: null   # null -> timestamp
